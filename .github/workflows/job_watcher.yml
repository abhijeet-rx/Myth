name: Myth ATS Job Watcher

on:
  schedule:
    # Runs every 15 minutes (offset by 7 minutes to bypass GitHub Actions peak queue dropouts)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Restore Seen Jobs Cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ github.run_id }}
          restore-keys: |
            seen-jobs-db-

      - name: Run Job Watcher Pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py --once

      - name: Save Seen Jobs Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ github.run_id }}
