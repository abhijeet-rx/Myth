name: Myth ATS Job Watcher

on:
  schedule:
    # Runs every 15 minutes (:00, :15, :30, :45)
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: myth-job-watcher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Restore Seen Jobs Cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ github.run_id }}
          restore-keys: |
            seen-jobs-db-

      - name: Run Job Watcher Pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py --once

      - name: Save Seen Jobs Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ github.run_id }}

      - name: Commit & Push Updated Seen Jobs DB
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_jobs.db
          git diff --staged --quiet || (git commit -m "chore: sync seen_jobs.db [skip ci]" && git push origin main)
